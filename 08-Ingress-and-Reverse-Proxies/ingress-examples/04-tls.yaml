# Stap 4: HTTPS met een eigen (self-signed) certificaat in de Secret "petshelter-tls".
# Maak die Secret eerst aan, zie de les.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: petshelter
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - petshelter.localhost
      secretName: petshelter-tls
  rules:
    - host: petshelter.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000
