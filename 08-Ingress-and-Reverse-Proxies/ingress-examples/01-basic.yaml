# Stap 1: alle verkeer (elke hostnaam, elk pad) naar de frontend.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: petshelter
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000
