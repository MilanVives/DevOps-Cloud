# Stap 5 (cloud): HTTPS met een echt certificaat van Let's Encrypt via cert-manager.
# Vereist: cert-manager geïnstalleerd, cluster-issuer.yaml toegepast, en een DNS-record
# van jouw domein naar het EXTERNAL-IP van Traefik.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: petshelter
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - petshelter.jouwdomein.be
      secretName: petshelter-tls
  rules:
    - host: petshelter.jouwdomein.be
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000
