# Uitgebreidere versie van compose.yml: vaste containernamen, restart policy,
# een eigen netwerk en een database met wachtwoord.
# Starten: docker compose -f extended-compose.yml up -d --build
services:
  mongodb:
    image: mongo:7
    container_name: mongodbcontainer
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example   # demo! In echte projecten: uit .env (zie 3-best-practice)
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network
    restart: always

  backend:
    build:
      context: ./api          # map met de Dockerfile van de API
    container_name: backendcontainer
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=mongodb://root:example@mongodb:27017/foodsdb?authSource=admin
    depends_on:
      - mongodb
    networks:
      - app-network
    restart: always

  frontend:
    build:
      context: ./frontend
    container_name: frontendcontainer
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - app-network
    restart: always

volumes:
  mongo_data:

networks:
  app-network:
    driver: bridge
